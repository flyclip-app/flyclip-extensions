name: JSON Formatter
identifier: com.flyclip.extension.json-formatter
description:
  en: Format (prettify) or compress (minify) JSON text
  zh: 格式化美化 JSON 或压缩单行 JSON
icon: "{}"
actions:
  - title: 格式化 JSON
    identifier: format
    javascript: |
      try {
        const obj = JSON.parse(flyclip.input.text);
        return JSON.stringify(obj, null, 2);
      } catch (e) {
        return "[JSON 解析失败: 语法格式有误]";
      }
    requirements: [text]
    after: paste-result

  - title: 压缩 JSON
    identifier: minify
    javascript: |
      try {
        const obj = JSON.parse(flyclip.input.text);
        return JSON.stringify(obj);
      } catch (e) {
        return "[JSON 解析失败: 语法格式有误]";
      }
    requirements: [text]
    after: paste-result
