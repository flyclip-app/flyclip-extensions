name: Join Lines
identifier: com.flyclip.extension.join-lines
description:
  en: Join multi-line text into a single line with custom delimiter
  zh: 将多行文本合并为单行，支持指定分隔符
icon: ->
options:
  - identifier: delimiter
    label:
      en: Delimiter
      zh: 分隔符类型
    type: multiple
    values:
      - comma_space
      - comma
      - space
      - semicolon
    value labels:
      - 逗号空格 (", ")
      - 纯逗号 (",")
      - 空格 (" ")
      - 分号 ("; ")
    default value: comma_space

actions:
  - title: 合并为单行
    identifier: join
    javascript: |
      const lines = flyclip.input.text.split(/\r\n|\r|\n/).filter(l => l.trim().length > 0);
      const delimMap = {
        comma: ",",
        space: " ",
        semicolon: "; ",
        comma_space: ", "
      };
      const delim = delimMap[flyclip.options.delimiter] || ", ";
      return lines.join(delim);
    requirements: [text]
    after: paste-result
