name: URL Encode
identifier: com.flyclip.extension.url-encode
description:
  en: Percent-encode or decode URL strings
  zh: URL 编码与解码转换
icon: "%20"
actions:
  - title: URL 编码
    identifier: encode
    javascript: return encodeURIComponent(flyclip.input.text);
    requirements: [text]
    after: paste-result

  - title: URL 解码
    identifier: decode
    javascript: |
      try {
        return decodeURIComponent(flyclip.input.text);
      } catch (e) {
        return flyclip.input.text;
      }
    requirements: [text]
    after: paste-result
