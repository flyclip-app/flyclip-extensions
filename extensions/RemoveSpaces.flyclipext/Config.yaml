name: Remove Spaces
identifier: com.flyclip.extension.remove-spaces
description:
  en: Remove all whitespace or collapse consecutive spaces
  zh: 删除所有空格或压缩多余空白字符
icon: "␣"
actions:
  - title: 压缩空格
    identifier: collapse
    javascript: return flyclip.input.text.replace(/\s+/g, ' ').trim();
    requirements: [text]
    after: paste-result

  - title: 消除所有空格
    identifier: remove_all
    javascript: return flyclip.input.text.replace(/\s+/g, '');
    requirements: [text]
    after: paste-result
