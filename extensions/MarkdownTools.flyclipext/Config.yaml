name: Markdown Tools
identifier: com.flyclip.extension.markdown-tools
description:
  en: Quick Markdown formatting (Bold, Italic, Code, Blockquote, Link)
  zh: 快捷 Markdown 格式化 (粗体、斜体、行内代码、代码块、引用、超链接)
icon: MD
actions:
  - title: 粗体 (**text**)
    identifier: bold
    javascript: return `**${flyclip.input.text}**`;
    requirements: [text]
    after: paste-result

  - title: 行内代码 (`code`)
    identifier: inline_code
    javascript: return `\`${flyclip.input.text}\``;
    requirements: [text]
    after: paste-result

  - title: 代码块 (```code```)
    identifier: code_block
    javascript: return "```\n" + flyclip.input.text + "\n```";
    requirements: [text]
    after: paste-result

  - title: 引用 (> quote)
    identifier: quote
    javascript: |
      return flyclip.input.text
        .split(/\r\n|\r|\n/)
        .map(line => `> ${line}`)
        .join("\n");
    requirements: [text]
    after: paste-result
