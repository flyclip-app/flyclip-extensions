name:
  en: Markdown Tools
  zh-CN: Markdown 格式化
description:
  en: Wrap text in Markdown bold, inline code, code blocks, or blockquotes.
  zh-CN: 快速为选中文本添加 Markdown 粗体、行内代码、代码块或引用标记。
identifier: com.flyclip.extension.markdown-tools
icon: MD
actions:
  - title: 粗体 (**text**)
    identifier: bold
    javascript: return `**${flyclip.input.text}**`;
    requirements: [text]
    after: paste-result

  - title: 行内代码 (`code`)
    identifier: inline_code
    javascript: return `\`${flyclip.input.text}\``;
    requirements: [text]
    after: paste-result

  - title: 代码块 (```code```)
    identifier: code_block
    javascript: return "```\n" + flyclip.input.text + "\n```";
    requirements: [text]
    after: paste-result

  - title: 引用 (> quote)
    identifier: quote
    javascript: |
      return flyclip.input.text
        .split(/\r\n|\r|\n/)
        .map(line => `> ${line}`)
        .join("\n");
    requirements: [text]
    after: paste-result
