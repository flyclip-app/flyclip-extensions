name: Markdown Tools
identifier: com.flyclip.extension.markdown-tools
description:
  en: Quick Markdown formatting (Bold, Italic, Code, Blockquote, Link)
  zh: 快捷 Markdown 格式化 (粗体、斜体、行内代码、代码块、引用、超链接)
icon: MD
actions:
  - title: 粗体 (**text**)
    identifier: bold
    shell script: Write-Host -NoNewline ("**" + $env:FLYCLIP_TEXT + "**")
    requirements: [text]
    after: paste-result

  - title: 行内代码 (`code`)
    identifier: inline_code
    shell script: Write-Host -NoNewline ("`" + $env:FLYCLIP_TEXT + "`")
    requirements: [text]
    after: paste-result

  - title: 代码块 (```code```)
    identifier: code_block
    shell script: Write-Host -NoNewline ("````r`n" + $env:FLYCLIP_TEXT + "`r`n```")
    requirements: [text]
    after: paste-result

  - title: 引用 (> quote)
    identifier: quote
    shell script: |
      $lines = $env:FLYCLIP_TEXT -split "`r`n|`r|`n"
      $quoted = $lines | ForEach-Object { "> $_" }
      Write-Host -NoNewline ($quoted -join "`r`n")
    requirements: [text]
    after: paste-result
