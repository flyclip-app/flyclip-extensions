name: Base64
identifier: com.flyclip.extension.base64
description:
  en: Encode or decode text with Base64
  zh: Base64 编码与解码转换
icon: B64
options:
  - identifier: url_safe
    label:
      en: URL-safe Base64 (- and _)
      zh: URL 安全模式 (使用 - 与 _)
    type: boolean
    default value: false

actions:
  - title: Base64 编码
    identifier: encode
    javascript: |
      const str = flyclip.input.text;
      let b64 = btoa(unescape(encodeURIComponent(str)));
      if (flyclip.options.url_safe === "1" || flyclip.options.url_safe === true) {
        b64 = b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      return b64;
    requirements: [text]
    after: paste-result

  - title: Base64 解码
    identifier: decode
    javascript: |
      let s = flyclip.input.text.trim();
      if (flyclip.options.url_safe === "1" || flyclip.options.url_safe === true) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4 !== 0) {
          s += '=';
        }
      }
      try {
        return decodeURIComponent(escape(atob(s)));
      } catch (e) {
        return "[Base64 解码错误: 格式不合法]";
      }
    requirements: [text]
    after: paste-result
