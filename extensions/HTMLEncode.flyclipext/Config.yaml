name: HTML Encode
identifier: com.flyclip.extension.html-encode
description:
  en: Encode or decode HTML special entities (&lt;, &gt;, &amp;, etc.)
  zh: HTML 实体编码与反转义解码
icon: <&>
actions:
  - title: HTML 转义
    identifier: encode
    javascript: |
      return flyclip.input.text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    requirements: [text]
    after: paste-result

  - title: HTML 反转义
    identifier: decode
    javascript: |
      return flyclip.input.text
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"')
        .replace(/&#039;/g, "'")
        .replace(/&#39;/g, "'");
    requirements: [text]
    after: paste-result
