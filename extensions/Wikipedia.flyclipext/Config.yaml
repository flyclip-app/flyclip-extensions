name:
  en: Wikipedia
  zh-CN: 维基百科
description:
  en: Search Wikipedia encyclopedia in multiple languages.
  zh-CN: 在维基百科中搜索选中文本词条。
identifier: com.flyclip.extension.wikipedia
icon: iconify:simple-icons:wikipedia
options:
  - identifier: lang
    label:
      en: Language Edition
      zh: 语言版本
    type: multiple
    values:
      - zh
      - en
      - ja
      - de
      - fr
      - es
      - ru
    value labels:
      - 中文 (zh)
      - English (en)
      - 日本語 (ja)
      - Deutsch (de)
      - Français (fr)
      - Español (es)
      - Русский (ru)
    default value: zh

actions:
  - title: Wikipedia
    url: https://{flyclip option lang}.wikipedia.org/wiki/{flyclip text}
    requirements: [text]
