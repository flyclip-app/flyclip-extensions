name:
  en: Calculate
  zh-CN: 即时数学计算
description:
  en: Evaluate math expressions instantly (e.g. 128*1024, (50+20)/3).
  zh-CN: 即时计算选中的数学表达式并显示结果。
identifier: com.flyclip.extension.calculate
icon: "=?"
actions:
  - title: 计算结果
    identifier: eval
    javascript: |
      const expr = flyclip.input.text.trim();
      try {
        const res = Function(`'use strict'; return (${expr})`)();
        return `${expr} = ${res}`;
      } catch (e) {
        return "[计算出错: 表达式无效]";
      }
    requirements: [text]
    after: show-result
