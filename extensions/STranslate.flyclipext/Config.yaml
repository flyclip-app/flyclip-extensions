name:
  en: STranslate
  zh-CN: STranslate 翻译
description:
  en: Trigger Windows open-source STranslate tool for deep translation.
  zh-CN: 通过本地服务或命令行调用 Windows 开源神器 STranslate 进行即时翻译。
identifier: com.flyclip.extension.stranslate
icon: ST
platforms: [windows] # 明确标记 Windows 平台，方便多设备 WebDAV 同步时按需启用
options:
  - identifier: trigger_mode
    label: 唤起方式
    type: multiple
    values: [http, cli]
    value labels: [本地 HTTP 服务, 命令行 CLI 唤起]
    default value: http
  - identifier: port
    label: HTTP 服务端口
    type: string
    default value: "50020"

actions:
  - title: STranslate
    javascript: |
      const text = flyclip.input.text.trim();
      const mode = flyclip.options.trigger_mode || "http";
      const port = flyclip.options.port || "50020";

      if (mode === "http") {
        try {
          await flyclip.fetch(`http://127.0.0.1:${port}/translate_force`, {
            method: "POST",
            body: text
          });
        } catch (e) {
          flyclip.run("STranslate", ["-t", text]);
        }
      } else {
        flyclip.run("STranslate", ["-t", text]);
      }
    requirements: [text]
