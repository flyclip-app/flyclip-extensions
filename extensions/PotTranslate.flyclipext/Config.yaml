name:
  en: Pot Translate
  zh-CN: Pot 划词翻译
description:
  en: Send selected text to Pot Desktop via local HTTP API for instant translation/OCR.
  zh-CN: 通过本地 HTTP 服务将选中文本发送至 Pot Desktop 进行划词翻译或 OCR。
identifier: com.flyclip.extension.pot-desktop
icon: iconify:simple-icons:googletranslate
options:
  - identifier: port
    label: Pot 本地服务端口
    type: string
    default value: "60828"
  - identifier: action_type
    label: 触发模式
    type: multiple
    values: [translate, ocr, recognize]
    value labels: [翻译 (Translate), 截图 OCR, 文本识别]
    default value: translate

actions:
  - title: Pot 翻译
    javascript: |
      const text = flyclip.input.text.trim();
      const port = flyclip.options.port || "60828";
      const action = flyclip.options.action_type || "translate";

      // 官方标准 API：POST / 或 POST /translate (Body 为待翻译纯文本)
      try {
        if (action === "ocr") {
          await flyclip.fetch(`http://127.0.0.1:${port}/ocr_recognize`);
        } else if (action === "recognize") {
          await flyclip.fetch(`http://127.0.0.1:${port}/ocr_translate`);
        } else {
          await flyclip.fetch(`http://127.0.0.1:${port}/`, {
            method: "POST",
            body: text
          });
        }
      } catch (e) {
        try {
          await flyclip.fetch(`http://127.0.0.1:${port}/selection_translate`);
        } catch (_) {
          flyclip.run("cmd", ["/c", "start", `pot:translate?text=${encodeURIComponent(text)}`]);
        }
      }
    requirements: [text]
