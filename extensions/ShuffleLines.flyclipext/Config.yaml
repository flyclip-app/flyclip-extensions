name:
  en: Shuffle Lines
  zh-CN: 随机打乱多行
identifier: com.flyclip.extension.shuffle-lines
description:
  en: Randomize the order of selected lines using the Fisher-Yates algorithm.
  zh-CN: 将选中的多行文本随机打乱排列顺序。
icon: iconify:tabler:arrows-shuffle
actions:
  - title:
      en: Shuffle Lines
      zh-CN: 随机打乱顺序
    identifier: shuffle
    javascript: "

      \            const lines = flyclip.input.text.split(/\\r\\n|\\r|\\n/);

      \            for (let i = lines.length - 1; i > 0; i--) {

      \              const j = Math.floor(Math.random() * (i + 1));

      \              [lines[i], lines[j]] = [lines[j], lines[i]];

      \            }

      \            return lines.join(\"\\n\");

      \          "
    requirements:
      - text
    after: paste-result
