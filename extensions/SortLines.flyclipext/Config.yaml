name: Sort Lines
identifier: com.flyclip.extension.sort-lines
description:
  en: Sort lines of text alphabetically, reversely, or remove duplicates
  zh: 多行文本按字母顺序升序、降序排序或去重
icon: AZ
options:
  - identifier: case_sensitive
    label:
      en: Case Sensitive Sort
      zh: 区分大小写
    type: boolean
    default value: false

actions:
  - title: 升序排序 (A-Z)
    identifier: sort_asc
    javascript: |
      const cs = flyclip.options.case_sensitive === "1" || flyclip.options.case_sensitive === true;
      const lines = flyclip.input.text.split(/\r\n|\r|\n/);
      lines.sort((a, b) => cs ? a.localeCompare(b, undefined, { sensitivity: 'case' }) : a.localeCompare(b));
      return lines.join("\n");
    requirements: [text]
    after: paste-result

  - title: 降序排序 (Z-A)
    identifier: sort_desc
    javascript: |
      const cs = flyclip.options.case_sensitive === "1" || flyclip.options.case_sensitive === true;
      const lines = flyclip.input.text.split(/\r\n|\r|\n/);
      lines.sort((a, b) => cs ? b.localeCompare(a, undefined, { sensitivity: 'case' }) : b.localeCompare(a));
      return lines.join("\n");
    requirements: [text]
    after: paste-result

  - title: 行去重 (Unique)
    identifier: unique
    javascript: |
      const cs = flyclip.options.case_sensitive === "1" || flyclip.options.case_sensitive === true;
      const lines = flyclip.input.text.split(/\r\n|\r|\n/);
      if (cs) {
        return Array.from(new Set(lines)).join("\n");
      } else {
        const seen = new Set();
        const result = [];
        for (const line of lines) {
          const lower = line.toLowerCase();
          if (!seen.has(lower)) {
            seen.add(lower);
            result.push(line);
          }
        }
        return result.join("\n");
      }
    requirements: [text]
    after: paste-result
