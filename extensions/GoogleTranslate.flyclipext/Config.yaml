name:
  en: Google Translate
  zh-CN: Google 翻译
description:
  en: Translate selected text with Google Translate worldwide.
  zh-CN: 使用 Google 翻译选中文本，支持多站点切换与目标语言设定。
identifier: com.flyclip.extension.google-translate
icon: iconify:simple-icons:googletranslate
options:
  - identifier: site
    label:
      en: Google Translate Site
      zh: 翻译站点
    type: multiple
    values:
      - translate.google.com
      - translate.google.cn
      - translate.google.com.hk
      - translate.google.co.jp
      - translate.google.co.uk
    value labels:
      - Global (translate.google.com)
      - China (translate.google.cn)
      - Hong Kong (translate.google.com.hk)
      - Japan (translate.google.co.jp)
      - UK (translate.google.co.uk)
    default value: translate.google.com

  - identifier: target_lang
    label:
      en: Target Language
      zh: 目标语言
    type: multiple
    values:
      - zh-CN
      - en
      - ja
      - ko
      - fr
      - de
      - es
      - ru
    value labels:
      - 简体中文 (zh-CN)
      - English (en)
      - 日本語 (ja)
      - 한국어 (ko)
      - Français (fr)
      - Deutsch (de)
      - Español (es)
      - Русский (ru)
    default value: zh-CN

actions:
  - title: Google Translate
    url: https://{flyclip option site}/?sl=auto&tl={flyclip option target_lang}&text={flyclip text}&op=translate
    requirements: [text]
