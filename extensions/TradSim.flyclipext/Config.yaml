name:
  en: Traditional/Simplified
  zh-CN: 简繁中文转换
identifier: com.flyclip.extension.traditional-simplified
description:
  en: Convert text between Traditional and Simplified Chinese with smart
    dictionary mapping.
  zh-CN: 在简体中文与繁体中文之间快速互转。
icon: iconify:tabler:language-hiragana
actions:
  - title:
      en: To Simplified (转简体)
      zh-CN: 转为简体中文
    identifier: to_simplified
    javascript: "

      \            // Traditional to Simplified conversion

      \            const text = flyclip.input.text;

      \            // Native Intl or standard char map fallback

      \            const t2sMap = {

      \              \"萬\": \"万\", \"與\": \"与\", \"醜\": \"丑\", \"專\": \"专\",
      \"業\": \"业\", \"叢\": \"丛\", \"東\": \"东\", \"絲\": \"丝\",

      \              \"丟\": \"丢\", \"兩\": \"两\", \"嚴\": \"严\", \"喪\": \"丧\",
      \"個\": \"个\", \"豐\": \"丰\", \"臨\": \"临\", \"為\": \"为\",

      \              \"麗\": \"丽\", \"舉\": \"举\", \"麼\": \"么\", \"樂\": \"乐\",
      \"喬\": \"乔\", \"習\": \"习\", \"鄉\": \"乡\", \"書\": \"书\",

      \              \"買\": \"买\", \"亂\": \"乱\", \"乾\": \"干\", \"了\": \"了\",
      \"爭\": \"争\", \"於\": \"于\", \"虧\": \"亏\", \"雲\": \"云\",

      \              \"亞\": \"亚\", \"產\": \"产\", \"畝\": \"亩\", \"親\": \"亲\",
      \"億\": \"亿\", \"僅\": \"仅\", \"從\": \"从\", \"侖\": \"仑\",

      \              \"倉\": \"仓\", \"儀\": \"仪\", \"們\": \"们\", \"價\": \"价\",
      \"眾\": \"众\", \"優\": \"优\", \"會\": \"会\", \"伛\": \"伛\",

      \              \"傘\": \"伞\", \"偉\": \"伟\", \"傳\": \"传\", \"傷\": \"伤\",
      \"體\": \"体\", \"倫\": \"伦\", \"伧\": \"伧\", \"偽\": \"伪\",

      \              \"佇\": \"伫\", \"僑\": \"侨\", \"儂\": \"侬\", \"儕\": \"侪\",
      \"儂\": \"侬\", \"俊\": \"俊\", \"俗\": \"俗\", \"俠\": \"侠\",

      \              \"係\": \"系\", \"促\": \"促\", \"俄\": \"俄\", \"俊\": \"俊\",
      \"俁\": \"俣\", \"係\": \"系\", \"俚\": \"俚\", \"保\": \"保\",

      \              \"俞\": \"俞\", \"俟\": \"俟\", \"信\": \"信\", \"修\": \"修\",
      \"儼\": \"俨\", \"倆\": \"俩\", \"儷\": \"俪\", \"儉\": \"俭\",

      \              \"債\": \"债\", \"傾\": \"倾\", \"傴\": \"偻\", \"僅\": \"仅\",
      \"僉\": \"佥\", \"像\": \"像\", \"僑\": \"侨\", \"僕\": \"仆\",

      \              \"僥\": \"侥\", \"僱\": \"雇\", \"價\": \"价\", \"儀\": \"仪\",
      \"儂\": \"侬\", \"億\": \"亿\", \"儅\": \"当\", \"鬧\": \"闹\",

      \              \"廣\": \"广\", \"歸\": \"归\", \"當\": \"当\", \"發\": \"发\",
      \"點\": \"点\", \"國\": \"国\", \"學\": \"学\", \"開\": \"开\",

      \              \"華\": \"华\", \"經\": \"经\", \"電\": \"电\", \"動\": \"动\",
      \"應\": \"应\", \"長\": \"长\", \"時\": \"时\", \"機\": \"机\",

      \              \"車\": \"车\", \"見\": \"见\", \"語\": \"语\", \"認\": \"认\",
      \"設\": \"设\", \"話\": \"话\", \"說\": \"说\", \"請\": \"请\",

      \              \"讀\": \"读\", \"誰\": \"谁\", \"調\": \"调\", \"諒\": \"谅\",
      \"論\": \"论\", \"資\": \"资\", \"賽\": \"赛\", \"贊\": \"赞\",

      \              \"辦\": \"办\", \"邊\": \"边\", \"運\": \"运\", \"進\": \"进\",
      \"遠\": \"远\", \"過\": \"过\", \"還\": \"还\", \"這\": \"这\",

      \              \"連\": \"连\", \"週\": \"周\", \"選\": \"选\", \"遺\": \"遗\",
      \"郵\": \"邮\", \"鄉\": \"乡\", \"錢\": \"钱\", \"鐵\": \"铁\",

      \              \"錄\": \"录\", \"門\": \"门\", \"問\": \"问\", \"間\": \"间\",
      \"關\": \"关\", \"隊\": \"队\", \"陽\": \"阳\", \"際\": \"际\",

      \              \"難\": \"难\", \"雙\": \"双\", \"雜\": \"杂\", \"雞\": \"鸡\",
      \"頭\": \"头\", \"題\": \"题\", \"類\": \"类\", \"風\": \"风\",

      \              \"飛\": \"飞\", \"飽\": \"饱\", \"飾\": \"饰\", \"館\": \"馆\",
      \"馬\": \"马\", \"體\": \"体\", \"高\": \"高\", \"髮\": \"发\",

      \              \"魚\": \"鱼\", \"鳥\": \"鸟\", \"點\": \"点\", \"齊\": \"齐\",
      \"齒\": \"齿\", \"龍\": \"龙\", \"龜\": \"龟\"

      \            };

      \            return text.split('').map(c => t2sMap[c] || c).join('');

      \          "
    requirements:
      - text
    after: paste-result
